version: '3'

vars:
  COVERAGE_FILE: coverage.out
  COVERAGE_HTML: coverage.html

tasks:
  # Run tests with gotestsum (human-friendly output)
  test:
    desc: Run tests with pretty output
    cmds:
      - gotestsum --format pkgname-and-test-fails
    silent: false

  # Verbose output showing all tests
  test:verbose:
    desc: Run tests with verbose output
    cmds:
      - gotestsum --format standard-verbose

  # Watch mode - re-run tests on file changes
  test:watch:
    desc: Watch mode - auto re-run tests on file changes
    cmds:
      - gotestsum --watch

  # Run tests with coverage
  test:coverage:
    desc: Run tests with coverage report
    cmds:
      - gotestsum -- -cover -coverprofile={{.COVERAGE_FILE}} ./...
      - go tool cover -html={{.COVERAGE_FILE}} -o {{.COVERAGE_HTML}}
      - echo "Coverage report generated at {{.COVERAGE_HTML}}"

  # Run tests with race detector
  test:race:
    desc: Run tests with race detector
    cmds:
      - gotestsum --format testname -- -race ./...

  # Run all checks (tests + race detector + coverage)
  test:all:
    desc: Run full test suite (race detector + coverage)
    cmds:
      - echo "==> Running tests with race detector..."
      - gotestsum --format testname -- -race ./...
      - echo ""
      - echo "==> Generating coverage report..."
      - gotestsum -- -cover -coverprofile={{.COVERAGE_FILE}} ./...
      - go tool cover -html={{.COVERAGE_FILE}} -o {{.COVERAGE_HTML}}
      - echo ""
      - echo "Coverage report at {{.COVERAGE_HTML}}"
      - echo "✅ All checks passed!"

  # Run tests for a specific package
  test:pkg:
    desc: Run tests for a specific package (usage - task test:pkg PKG=internal/core)
    cmds:
      - gotestsum --format testname -- ./{{.PKG}}/...

  # Different output formats
  test:dots:
    desc: Run tests with dots format
    cmds:
      - gotestsum --format dots

  test:testname:
    desc: Run tests showing each test name
    cmds:
      - gotestsum --format testname

  # Build the project
  build:
    desc: Build the GoVec server
    cmds:
      - go build -o govec cmd/server/main.go
    generates:
      - govec

  # Run the server
  run:
    desc: Run the GoVec server
    cmds:
      - go run cmd/server/main.go

  # Clean build artifacts and coverage reports
  clean:
    desc: Clean build artifacts and test coverage files
    cmds:
      - rm -f govec {{.COVERAGE_FILE}} {{.COVERAGE_HTML}}
      - echo "Cleaned build artifacts"

  # Install dependencies
  deps:
    desc: Install project dependencies
    cmds:
      - go mod download
      - go mod tidy

  # Install gotestsum if not present
  install-gotestsum:
    desc: Install gotestsum for pretty test output
    cmds:
      - go install gotest.tools/gotestsum@latest
    status:
      - command -v gotestsum
