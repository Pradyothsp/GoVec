version: "3"

vars:
  COVERAGE_FILE: coverage.out
  COVERAGE_HTML: coverage.html
  WAL_FILE: govec.wal
  BIN_FILE: govec_data.bin

tasks:
  # Run tests with gotestsum (human-friendly output)
  test:
    desc: Run tests with pretty output
    cmds:
      - gotestsum --format pkgname-and-test-fails
    silent: false

  # Verbose output showing all tests
  test:verbose:
    desc: Run tests with verbose output
    aliases: [test:v]
    cmds:
      - gotestsum --format standard-verbose

  # Watch mode - re-run tests on file changes
  test:watch:
    desc: Watch mode - auto re-run tests on file changes
    cmds:
      - gotestsum --watch

  # Run tests with coverage
  test:coverage:
    desc: Run tests with coverage report
    cmds:
      - gotestsum -- -cover -coverprofile={{.COVERAGE_FILE}} ./...
      - go tool cover -html={{.COVERAGE_FILE}} -o {{.COVERAGE_HTML}}
      - echo "Coverage report generated at {{.COVERAGE_HTML}}"

  # Run tests with race detector
  test:race:
    desc: Run tests with race detector
    cmds:
      - gotestsum --format testname -- -race ./...

  # Run all checks (tests + race detector + coverage)
  test:all:
    desc: Run full test suite (race detector + coverage)
    aliases: [test:a]
    cmds:
      - echo "==> Running tests with race detector..."
      - gotestsum --format testname -- -race ./...
      - echo ""
      - echo "==> Generating coverage report..."
      - gotestsum -- -cover -coverprofile={{.COVERAGE_FILE}} ./...
      - go tool cover -html={{.COVERAGE_FILE}} -o {{.COVERAGE_HTML}}
      - echo ""
      - echo "Coverage report at {{.COVERAGE_HTML}}"
      - echo "✅ All checks passed!"

  # Run tests for a specific package
  test:pkg:
    desc: Run tests for a specific package (usage - task test:pkg PKG=internal/core)
    cmds:
      - gotestsum --format testname -- ./{{.PKG}}/...

  # Different output formats
  test:dots:
    desc: Run tests with dots format
    cmds:
      - gotestsum --format dots

  test:testname:
    desc: Run tests showing each test name
    cmds:
      - gotestsum --format testname

  test:benchmark:
    desc: Run Go benchmarks
    aliases: [test:b]
    cmds:
      - go test -bench=. -run=^$ -v ./...

  # Run linters with golangci-lint
  lint:
    desc: Run linters (golangci-lint)
    cmds:
      - golangci-lint run ./...

  # Run go vet
  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  # Check formatting without modifying files
  fmt:check:
    desc: Check if code is formatted (exits non-zero if not)
    cmds:
      - |
        # Get list of unformatted files
        UNFORMATTED_FILES=$(gofmt -l .)
        # Filter out swagger files, ignore grep's exit 1 if no matches
        FILTERED_UNFORMATTED=$(echo "$UNFORMATTED_FILES" | grep -v "build/swagger" || true)

        if [ -n "$FILTERED_UNFORMATTED" ]; then
          echo "Unformatted files:"
          echo "$FILTERED_UNFORMATTED"
          exit 1
        fi
        echo "All files are formatted."

  # Fix formatting in-place
  fmt:fix:
    desc: Format all Go source files
    cmds:
      - gofmt -w .
      - echo "Formatting applied."

  # Vulnerability scanning
  vuln:
    desc: Run govulncheck for known vulnerabilities
    cmds:
      - govulncheck ./...

  # Run all static checks (lint + vet + fmt + vuln)
  check:
    desc: Run all static checks (lint, vet, fmt, vuln)
    cmds:
      - task: vet
      - task: fmt:check
      - task: lint
      - task: vuln

  # Build the project
  build:
    desc: Build the GoVec server
    cmds:
      - go build -o govec cmd/server/main.go
    generates:
      - govec

  # Run the server
  run:
    desc: Run the GoVec server
    cmds:
      - go run cmd/server/main.go

  # Clean build artifacts and coverage reports
  clean:
    desc: Clean build artifacts and test coverage files
    cmds:
      - rm -f govec {{.COVERAGE_FILE}} {{.COVERAGE_HTML}} {{.WAL_FILE}} {{.BIN_FILE}}
      - echo "Cleaned build artifacts"

  # Install dependencies
  deps:
    desc: Install project dependencies
    cmds:
      - go mod download
      - go mod tidy

  # Install gotestsum if not present
  install-gotestsum:
    desc: Install gotestsum for pretty test output
    cmds:
      - go install gotest.tools/gotestsum@latest
    status:
      - command -v gotestsum

  # Generate Swagger/OpenAPI documentation from annotations
  swagger:
    desc: Generate Swagger/OpenAPI documentation from annotations
    cmds:
      - swag init -g cmd/server/main.go --output build/swagger

  # Install swag CLI if not present
  install-swag:
    desc: Install swag CLI for Swagger doc generation
    cmds:
      - go install github.com/swaggo/swag/cmd/swag@latest
    status:
      - command -v swag

  # Install all development tools
  install-tools:
    desc: Install all development tools (gotestsum, golangci-lint, govulncheck, swag)
    vars:
      GOLANGCI_LINT_VERSION: v2.9.0
    cmds:
      - echo "==> Installing gotestsum..."
      - go install gotest.tools/gotestsum@latest
      - echo "==> Installing govulncheck..."
      - go install golang.org/x/vuln/cmd/govulncheck@latest
      - echo "==> Installing golangci-lint {{.GOLANGCI_LINT_VERSION}}..."
      - curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b $(go env GOPATH)/bin {{.GOLANGCI_LINT_VERSION}}
      - echo "==> Installing swag..."
      - go install github.com/swaggo/swag/cmd/swag@latest
      - echo "All tools installed."
