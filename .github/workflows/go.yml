name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...

      - name: Test with race detector and coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          fail_ci_if_error: false

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l . | grep -v "^build/swagger" | grep -v "^gen/" || true)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check Swagger docs are up to date
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          swag init -g cmd/server/main.go --output build/swagger
          git diff --exit-code build/swagger

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.66.0"

      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1
          go install golang.org/x/tools/cmd/goimports@latest

      - name: Lint proto files
        run: buf lint

      - name: Check proto stubs are up to date
        run: |
          buf generate
          goimports -w gen/
          git diff --exit-code gen/

  # Builds the release image on every PR and push -- never pushed anywhere -- so a change that
  # breaks the Dockerfile fails here instead of in release.yml after a tag is cut. Shares the
  # build cache with release.yml, so tag builds start from layers CI already built.
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build for every release platform
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: VERSION=ci-${{ github.sha }}
          cache-from: type=gha,scope=govec-image
          cache-to: type=gha,scope=govec-image,mode=max

      # A multi-platform build can't be loaded into the local daemon, so load amd64 on its
      # own -- every layer comes from the cache the step above just filled.
      - name: Load the amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: govec:ci
          build-args: VERSION=ci-${{ github.sha }}
          cache-from: type=gha,scope=govec-image

      - name: Smoke-test the image
        env:
          EXPECTED_VERSION: ci-${{ github.sha }}
        run: |
          docker run -d --name govec -p 9697:9697 govec:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:9697/health; then
              version=$(curl -fsS http://localhost:9697/api/v1/info | jq -r .data.version)
              [ "$version" = "$EXPECTED_VERSION" ] && exit 0
              echo "image reports version '$version', expected '$EXPECTED_VERSION'"
              exit 1
            fi
            sleep 1
          done
          docker logs govec
          exit 1
