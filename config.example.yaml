# Example GoVec Configuration
# Copy this file to config.yaml and customize

server:
  host: "0.0.0.0" # Bind to all interfaces
  port: 9000 # Custom port
  shutdown_timeout: 15s

storage:
  data_path: "/var/lib/govec/data.bin"
  wal_path: "/var/lib/govec/govec.wal"
  auto_save_enabled: true
  auto_save_interval: 120s # Save every 2 minutes
