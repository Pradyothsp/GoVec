# GoVec Configuration Reference
# Every option with its default and what it does. Copy this file to config.yaml (or point
# GOVEC_CONFIG_PATH at your copy) and change only what you need.
#
# Every field below has a GOVEC_* environment override, and environment wins over this
# file. The name is GOVEC_ plus the key: storage.wal_path -> GOVEC_WAL_PATH. The section
# is included only where the key alone would be ambiguous -- server.host and server.port
# are GOVEC_SERVER_HOST / GOVEC_SERVER_PORT, and every grpc key carries GRPC_, so that
# server.port and grpc.port stay distinguishable.
#
# An unset or empty variable leaves the value here alone; an unparseable one logs a
# warning and keeps it, rather than refusing to start.

server:
  host: "" # Bind to all interfaces (0.0.0.0)
  port: 9697 # HTTP server port
  shutdown_timeout: 10s       # Grace period for in-flight requests on SIGINT/SIGTERM
  read_header_timeout: 10s    # Max time to read request headers, guarding against Slowloris
  api_key: ""  # Optional: require Bearer token on all /api/v1/* routes
  log_level: "info" # Options: "debug", "info", "warn", "error", "fatal"
  pprof_enabled: false        # Serve net/http/pprof on pprof_addr, separate from the API port
  pprof_addr: "localhost:6060" # Keep on loopback -- pprof exposes heap and goroutine state

storage:
  data_path: "./govec_data.bin" # Snapshot file, written by auto-save and on shutdown
  wal_path: "./govec.wal"     # Write-ahead log of changes since the last snapshot; replayed on startup
  auto_save_enabled: true     # Periodic snapshot. Note: a save takes the write lock for the whole
  auto_save_interval: 60s     # snapshot, briefly blocking queries -- disable it when benchmarking latency.
  enable_mmap: false          # Set to true to store vectors in OS-managed mmap files (requires dimensions > 0)
  mmap_store_path: "./govec_mmap/" # Directory for .vec chunk files (used when enable_mmap: true)

engine:
  index_type: "brute"         # Options: "brute" (linear scan, default), "hnsw" (ANN, faster for >10k vectors)
  quantization: "none"        # Options: "none" (float32), "scalar" (int8, 4x memory reduction)
  distance_metric: "cosine"   # Options: "cosine", "euclidean"
  dimensions: 0               # Required when enable_mmap: true (e.g. 1536 for OpenAI embeddings). 0 = no upfront enforcement
  enable_hybrid_search: false  # Blends sparse-vector scores into search (0.7 dense + 0.3 sparse) when a query has one
  enable_metadata_index: false # Enables in-memory inverted index for fast filtered search (brute & HNSW)
  # HNSW parameters (only used when index_type: "hnsw")
  hnsw_m: 16                  # Max connections per node (higher = better recall, more memory)
  hnsw_ef_search: 100         # Query-time search breadth (higher = better recall, slower). Raise it for large k
  hnsw_ef_construction: 100   # Build-time search breadth (higher = better graph, slower inserts)
  # hnsw_batch_parallelism: 0        # Concurrent workers for a single Add() call's round-based parallel Prepare phase. 0 = runtime.GOMAXPROCS(0)
  # hnsw_batch_parallel_threshold: 20 # Minimum node count in one Add() call before parallelism kicks in at all; below it, inserts stay fully serial

grpc:
  enabled: false              # Set to true to start the gRPC server
  port: 9698                 # gRPC listen port (must differ from HTTP port)
  max_recv_msg_size_mb: 64    # Max incoming message size in MB
