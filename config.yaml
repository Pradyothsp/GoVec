# GoVec Configuration File
# See AGENTS.md for detailed configuration documentation

server:
  host: "" # Bind to all interfaces (0.0.0.0)
  port: 8000 # HTTP server port
  shutdown_timeout: 10s
  api_key: ""  # Optional: require Bearer token on all /api/v1/* routes. Override: GOVEC_API_KEY
  log_level: "debug" # Options: "debug", "info", "warn", "error", "fatal"

storage:
  data_path: "./govec_data.bin"
  wal_path: "./govec.wal"
  auto_save_enabled: true     # Periodic snapshot. Note: a save takes the write lock for the whole
  auto_save_interval: 60s     # snapshot, briefly blocking queries -- disable it when benchmarking latency.
  enable_mmap: false          # Set to true to store vectors in OS-managed mmap files (requires dimensions > 0)
  mmap_store_path: "./govec_mmap/" # Directory for .vec chunk files (used when enable_mmap: true)

engine:
  index_type: "brute"         # Options: "brute" (linear scan, default), "hnsw" (ANN, faster for >10k vectors)
  quantization: "none"        # Options: "none" (float32), "scalar" (int8, 4x memory reduction)
  distance_metric: "cosine"   # Options: "cosine", "euclidean"
  dimensions: 0               # Required when enable_mmap: true (e.g. 1536 for OpenAI embeddings). 0 = no upfront enforcement
  enable_hybrid_search: true   # Enables the Inverted Index for Sparse Vectors
  enable_metadata_index: false # Enables in-memory inverted index for fast filtered search (brute & HNSW)
  # HNSW parameters (only used when index_type: "hnsw")
  hnsw_m: 16                  # Max connections per node (higher = better recall, more memory)
  hnsw_ef_search: 50          # Query-time search breadth (higher = better recall, slower). recall@1/5 plateaus at 50
  hnsw_ef_construction: 200   # Build-time search breadth (higher = better graph, slower inserts)
  # hnsw_batch_parallelism: 0        # Concurrent workers for a single Add() call's round-based parallel Prepare phase. 0 = runtime.GOMAXPROCS(0)
  # hnsw_batch_parallel_threshold: 20 # Minimum node count in one Add() call before parallelism kicks in at all; below it, inserts stay fully serial

grpc:
  enabled: false              # Set to true to start the gRPC server. Override: GOVEC_GRPC_ENABLED
  port: 50051                 # gRPC listen port (must differ from HTTP port). Override: GOVEC_GRPC_PORT
  max_recv_msg_size_mb: 64    # Max incoming message size in MB. Override: GOVEC_GRPC_MAX_RECV_MSG_SIZE_MB
