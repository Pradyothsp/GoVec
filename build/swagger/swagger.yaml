basePath: /
definitions:
  api.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  handlers.CreateVectorRequest:
    properties:
      id:
        example: vec-001
        type: string
      metadata:
        type: object
      sparse_vector:
        type: object
      vector:
        items:
          type: number
        type: array
    required:
    - id
    - vector
    type: object
  handlers.DeleteResponse:
    properties:
      id:
        example: vec-001
        type: string
      status:
        example: deleted
        type: string
    type: object
  handlers.InsertResponse:
    properties:
      status:
        example: inserted
        type: string
    type: object
  handlers.SearchRequest:
    properties:
      filter:
        type: object
      k:
        example: 10
        type: integer
      sparse_vector:
        type: object
      vector:
        items:
          type: number
        type: array
    required:
    - vector
    type: object
  index.SearchResult:
    properties:
      ID:
        example: vec-001
        type: string
      Meta:
        type: object
      Score:
        example: 0.97
        type: number
    type: object
  response.ErrorResponse:
    properties:
      error:
        example: error message
        type: string
      success:
        example: false
        type: boolean
    type: object
  response.Response:
    properties:
      data: {}
      error:
        example: ""
        type: string
      success:
        example: true
        type: boolean
    type: object
host: localhost:8000
info:
  contact: {}
  description: A vector database REST API for storing and querying vector embeddings.
  title: GoVec API
  version: "1.0"
paths:
  /api/v1/vectors:
    post:
      consumes:
      - application/json
      parameters:
      - description: Vector payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateVectorRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/handlers.InsertResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Insert or update a vector
      tags:
      - vectors
  /api/v1/vectors/{id}:
    delete:
      parameters:
      - description: Vector ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/handlers.DeleteResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a vector by ID
      tags:
      - vectors
  /api/v1/vectors/search:
    post:
      consumes:
      - application/json
      parameters:
      - description: Search payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.SearchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/index.SearchResult'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Search for similar vectors
      tags:
      - vectors
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/api.HealthResponse'
              type: object
      summary: Health check
      tags:
      - system
schemes:
- http
securityDefinitions:
  BearerAuth:
    description: Type 'Bearer ' followed by your API key.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
